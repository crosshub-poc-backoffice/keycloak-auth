# 인증 서버 (Keycloak 26.8.1 + 전용 Postgres). 로컬/개발용.
#   실행: docker compose up -d --wait   → http://localhost:8080 (관리 콘솔 /admin, 계정은 .env 의 KC_BOOTSTRAP_ADMIN_*)
#   끄기: docker compose down            (데이터는 볼륨 keycloak_keycloak-db 에 남음)
#   초기화: docker compose down -v       (realm 을 JSON 에서 다시 import 하고 싶을 때. 사용자·비번도 지워진다)
# - 처음 뜰 때 realm/*.json 을 자동 import (백오피스 tp-office, 고객 tp). 이미 있는 realm 은 덮어쓰지 않음
# - client secret·테스트 비번은 .env 에서 받아 realm JSON 의 ${...} 자리표시에 들어감 (.env 는 git 금지)
# - 다른 로컬 컨테이너(BE DB·FE Redis)와의 관계는 BE 레포 docs/local-infra.md
# 프로젝트 이름 고정: BE 레포 infra/keycloak 에 있던 시절의 컨테이너(keycloak-keycloak-1)·볼륨(keycloak_keycloak-db)을
# 그대로 쓴다. 바꾸면 Keycloak DB(사용자·비번)가 새로 만들어진다 — 바꾸지 말 것
name: keycloak
services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?.env의 KC_DB_PASSWORD 필요}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?.env의 KC_DB_PASSWORD 필요}
      # 최초 관리자(master realm) — 처음 뜰 때만 생성된다
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?.env의 KC_BOOTSTRAP_ADMIN_USERNAME 필요}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?.env의 KC_BOOTSTRAP_ADMIN_PASSWORD 필요}
      KC_HEALTH_ENABLED: "true"
      # realm JSON의 ${...} 자리표시로 들어가는 client secret (FE .env 값과 같아야 함)
      TP_OFFICE_MERCHANT_WEB_CLIENT_SECRET: ${TP_OFFICE_MERCHANT_WEB_CLIENT_SECRET:?.env 필요}
      TP_OFFICE_MERCHANT_SVC_CLIENT_SECRET: ${TP_OFFICE_MERCHANT_SVC_CLIENT_SECRET:?.env 필요}
      # 고객 realm(tp) 의 테스트 고객 비번 — realm/tp-realm.json 의 ${...} 자리표시에 들어감 (로컬·개발 전용)
      TP_TEST_CUSTOMER_PASSWORD: ${TP_TEST_CUSTOMER_PASSWORD:?.env 필요}
      # merchant 백오피스 FE 주소 — tp-office-merchant-web 의 redirect·webOrigins·로그아웃 후 이동 주소가 여기서 만들어진다
      TP_OFFICE_MERCHANT_WEB_URL: ${TP_OFFICE_MERCHANT_WEB_URL:?.env의 TP_OFFICE_MERCHANT_WEB_URL 필요}
      # 백채널 로그아웃: Keycloak(컨테이너) → FE 서버로 직접 호출. 로컬은 host.docker.internal(= 내 Mac)
      TP_OFFICE_MERCHANT_WEB_BACKCHANNEL_LOGOUT_URL: ${TP_OFFICE_MERCHANT_WEB_BACKCHANNEL_LOGOUT_URL:?.env의 TP_OFFICE_MERCHANT_WEB_BACKCHANNEL_LOGOUT_URL 필요}
      # app 백오피스(앱 운영) — tp-office-app-web·tp-office-app-svc. 실제 app 백오피스가 붙기 전까지 로컬 임시값이면 된다
      TP_OFFICE_APP_WEB_CLIENT_SECRET: ${TP_OFFICE_APP_WEB_CLIENT_SECRET:?.env 필요}
      TP_OFFICE_APP_SVC_CLIENT_SECRET: ${TP_OFFICE_APP_SVC_CLIENT_SECRET:?.env 필요}
      TP_OFFICE_APP_WEB_URL: ${TP_OFFICE_APP_WEB_URL:?.env의 TP_OFFICE_APP_WEB_URL 필요}
      TP_OFFICE_APP_WEB_BACKCHANNEL_LOGOUT_URL: ${TP_OFFICE_APP_WEB_BACKCHANNEL_LOGOUT_URL:?.env의 TP_OFFICE_APP_WEB_BACKCHANNEL_LOGOUT_URL 필요}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux에서도 내 PC를 가리키게 (Mac은 기본 지원)
    ports:
      - "8080:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    # 이미지에 curl 이 없어 bash 의 /dev/tcp 로 관리 포트(9000)의 /health/ready 를 본다 → `up --wait` 가 realm import 까지 기다린다
    healthcheck:
      test:
        - CMD-SHELL
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3 && grep -q ''"status": "UP"'' <&3'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  keycloak-db:
